name: UI tests

# Lane TERPISAH dari `ci.yml`, dan itu yang penting.
#
# Test instrumentasi butuh emulator: menyalakannya, menunggu boot, memasang dua
# APK, lalu menjalankannya. Ongkosnya menit, bukan detik. Menggabungkannya ke
# gate cepat akan membuat setiap push menunggu belasan menit, dan gate yang
# lambat pelan-pelan berhenti dibaca orang.
#
# Karena itu: `ci.yml` tetap jalan di setiap push dan tetap di bawah semenit,
# sementara ini jalan di PR, terjadwal, dan saat dipanggil manual.
on:
  pull_request:
  workflow_dispatch:
  schedule:
    # Sekali sehari. Regresi UI tidak muncul dari udara; ia muncul dari commit,
    # dan jadwal harian cukup untuk menangkapnya sebelum menumpuk.
    - cron: '0 21 * * *'

concurrency:
  group: ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        # API 26 adalah minSdk, API 34 mewakili perangkat yang dipakai sekarang.
        # Menguji satu saja membuat separuh rentang yang didukung tidak pernah
        # dijalankan, dan perilaku Compose di API lama memang berbeda.
        api-level: [26, 34]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v4

      - name: Pasang SDK platform
        run: sdkmanager --install "platforms;android-36.1" "build-tools;36.1.0"

      - uses: gradle/actions/setup-gradle@v6

      # Akselerasi KVM. Tanpa ini emulator jatuh ke mode software dan test yang
      # harusnya beberapa menit jadi puluhan menit lalu kena timeout.
      - name: Aktifkan KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Hanya varian `full` yang diuji di sini. Bedanya dengan `lite` cuma
      # dukungan romanisasi Jepang, dan itu sudah dijaga penuh oleh unit test
      # yang jalan untuk KEDUA varian di ci.yml. Menjalankan emulator dua kali
      # untuk perbedaan yang tidak menyentuh UI cuma menggandakan ongkos.
      - name: Test instrumentasi
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: ${{ matrix.api-level >= 30 && 'google_apis' || 'default' }}
          # Animasi dimatikan. Test Compose menunggu sampai idle, dan animasi
          # yang berjalan terus membuat idle tidak pernah tercapai lalu test
          # menggantung sampai timeout.
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew connectedFullDebugAndroidTest --console=plain

      - name: Unggah laporan
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: laporan-ui-api${{ matrix.api-level }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 14
