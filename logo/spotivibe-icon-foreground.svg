<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108" role="img" aria-label="Spotivibe">
  <title>Spotivibe foreground</title>
  <!--
    Lapisan foreground untuk adaptive icon Android. Latar transparan;
    background-nya dipasang terpisah (#14151B).

    Dipakai juga sebagai lapisan monochrome untuk themed icon Android 13+.
    Di mode itu Android membuang warna dan mewarnai ulang seluruh bentuk
    dengan satu warna, tapi TETAP menghormati alpha. Karena itu baris aktif
    sengaja dibedakan lewat UKURAN (paling tinggi dan paling lebar), bukan
    cuma lewat warna, supaya tetap terbaca saat warnanya diseragamkan.
  -->
  <rect x="39"   y="27.5" width="30" height="5" rx="2.5" fill="#8A877F" opacity="0.55"/>
  <rect x="31"   y="39"   width="46" height="6" rx="3"   fill="#C2BFB6" opacity="0.85"/>
  <rect x="25"   y="50"   width="58" height="8" rx="4"   fill="#EC6A5C"/>
  <rect x="33"   y="63"   width="42" height="6" rx="3"   fill="#C2BFB6" opacity="0.85"/>
  <rect x="41"   y="75.5" width="26" height="5" rx="2.5" fill="#8A877F" opacity="0.55"/>
</svg>
