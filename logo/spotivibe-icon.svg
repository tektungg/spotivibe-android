<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108" role="img" aria-label="Spotivibe">
  <title>Spotivibe</title>
  <!--
    Lima baris lirik, satu menyala.

    Warna dan alpha diambil PERSIS dari LyricLineState di LyricsList.kt:
      Active  accent            alpha 1.00   (baris yang sedang dinyanyikan)
      Near    ink2  #C2BFB6     alpha 0.85
      Far     ink3  #8A877F     alpha 0.55
    Tinggi tiap batang mengikuti skala tipografi yang sama (30/22/18 sp),
    jadi hierarki visualnya identik dengan yang dilihat user di layar.

    Semua isi berada di dalam lingkaran r=33 berpusat di (54,54), yaitu zona
    aman adaptive icon Android, supaya tidak terpotong mask bulat maupun
    squircle.
  -->
  <rect width="108" height="108" fill="#14151B"/>

  <!-- Far -->
  <rect x="39"   y="27.5" width="30" height="5" rx="2.5" fill="#8A877F" opacity="0.55"/>
  <!-- Near -->
  <rect x="31"   y="39"   width="46" height="6" rx="3"   fill="#C2BFB6" opacity="0.85"/>
  <!-- Active -->
  <rect x="25"   y="50"   width="58" height="8" rx="4"   fill="#EC6A5C"/>
  <!-- Near -->
  <rect x="33"   y="63"   width="42" height="6" rx="3"   fill="#C2BFB6" opacity="0.85"/>
  <!-- Far -->
  <rect x="41"   y="75.5" width="26" height="5" rx="2.5" fill="#8A877F" opacity="0.55"/>
</svg>
